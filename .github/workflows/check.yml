name: 토큰 점검
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 점검
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python check.py
