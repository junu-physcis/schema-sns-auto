    서울대 물리교육과 수석 입학, 제 전공으로 하는 수업이에요.

    교재 4종으로 개념 → 실전 → 분석까지 겨울에 한 바퀴 돌아요.


    · 토 오후 고2 연합 물리학 · 1/2 개강 · 9회 (영통 이강학원)

    · 일 오후 고2 병점 물리학 · 1/3 개강 · 9회 (영통 이강학원)

    · 화 저녁 고2 병점 물리학 · 1/5 개강 · 8회 (동탄 모두의 선생님)

    · 금 오전 · 오후 클리닉 (영통 이강학원)


    상담은 영통 031-204-1353, 동탄 031-548-0938로 주세요.'
  replies:
  - text: 연합반은 학기 중에는 토요일 오전 · 오후로 바뀌어요.
